<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Tracker</title>
  <style>
    :root { --blue:#2563eb; --blue-dark:#1d4ed8; --bg:#f3f4f6; --card:#ffffff;
            --text:#111827; --muted:#6b7280; --line:#e5e7eb; --red:#dc2626; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           line-height:1.5; }
    .topbar { background:var(--blue); color:#fff; padding:14px 20px;
              font-size:18px; font-weight:600; }
    .wrap { max-width:900px; margin:20px auto; padding:0 12px; }
    .card { background:var(--card); border-radius:12px; padding:20px;
            box-shadow:0 1px 3px rgba(0,0,0,.1); }
    h2 { margin-top:0; }
    h3 { margin:24px 0 8px; }
    a { color:var(--blue); text-decoration:none; }
    a:hover { text-decoration:underline; }

    input, select, textarea { padding:10px 12px; border:1px solid #d1d5db;
      border-radius:8px; font-size:16px; font-family:inherit; max-width:100%; }
    form input, form select, form textarea { margin-bottom:10px; }
    input:focus, select:focus, textarea:focus { outline:2px solid #bfdbfe;
      border-color:var(--blue); }

    button { background:var(--blue); color:#fff; border:0; border-radius:8px;
             padding:10px 16px; font-size:15px; cursor:pointer; }
    button:hover { background:var(--blue-dark); }
    form[action^="/delete"] button { background:var(--red); padding:4px 10px;
                                     font-size:13px; margin-left:6px; }
    form[action^="/delete"] button:hover { background:#b91c1c; }

    table { border-collapse:collapse; width:100%; background:#fff; }
    table, th, td { border:0; }
    th { background:#f9fafb; text-align:left; font-size:13px; color:var(--muted);
         text-transform:uppercase; letter-spacing:.03em; }
    th, td { padding:10px 12px; border-bottom:1px solid var(--line); }
    tr:hover td { background:#f9fafb; }

    .flash { background:#fee2e2; color:#991b1b; padding:10px 14px;
             border-radius:8px; margin-bottom:12px; }
    p { margin:8px 0; }

    @media (max-width:600px) {
      .card { padding:14px; }
      input, select, textarea { width:100%; }
      td, th { font-size:14px; padding:8px; }
    }
  </style>
</head>
<body>
  <div class="topbar">Job Tracker</div>
  <div class="wrap">
    <div class="card">
      {% for msg in get_flashed_messages() %}<div class="flash">{{ msg }}</div>{% endfor %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
